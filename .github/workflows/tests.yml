name: tests

# Pushes and pull requests run the tests. The apps are built only for a version tag, which
# also publishes them as a release, or from the Run workflow button to try a build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  mac:
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, mac]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Run install.ps1 the way the README does, in Windows PowerShell 5.1 like a stock laptop.
      - name: Install with install.ps1 (fresh)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoStart
      - name: Install with install.ps1 again (the update path)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoStart
      - name: Self-test the installed app
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\HandsDown\HandsDown.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist\HandsDown -DestinationPath HandsDown-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HandsDown-windows
          path: HandsDown-windows.zip

  build-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, mac]
    runs-on: macos-latest  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm packaging/handsdown.spec
      - name: Self-test the app bundle
        run: dist/HandsDown.app/Contents/MacOS/HandsDown --self-test
      - name: Zip the app
        run: ditto -c -k --keepParent dist/HandsDown.app HandsDown-macos.zip  # keeps the bundle's links and signature
      - uses: actions/upload-artifact@v4
        with:
          name: HandsDown-macos
          path: HandsDown-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release with both builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" HandsDown-windows.zip HandsDown-macos.zip
          --repo "${{ github.repository }}" --title "Hands Down ${{ github.ref_name }}" --generate-notes
